<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GESTÃO · AÇÕES · ATA · DUO</title>
<link rel="icon" type="image/png" href="logo-doisa.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary:      #1B3464;
    --primary-rgb:  27, 52, 100;
    --primary-dark: #0F1F3D;
    --accent:       #E87B1E;
    --accent-rgb:   232, 123, 30;
    --accent-light: #F5A849;
    --amber:        #FBBF24;
    --ruby:         #F87171;
    --purple:       #A78BFA;
    --teal:         #2DD4BF;
    --dim:          #6E7E9E;
    --text:         #FFFFFF;
    --text-muted:   rgba(255,255,255,0.62);
    --text-faint:   rgba(255,255,255,0.38);
    --glass-bg:     rgba(255,255,255,0.05);
    --glass-bg-strong: rgba(255,255,255,0.085);
    --glass-border: rgba(255,255,255,0.09);
    --glass-border-strong: rgba(255,255,255,0.16);
    --ok:     #34D399;
    --warn:   #FBBF24;
    --danger: #F87171;
    --info:   #60A5FA;
    --col-pend: var(--amber);
    --col-pend-rgb: 251, 191, 36;
    --col-acomp: var(--accent);
    --col-acomp-rgb: 232, 123, 30;
  }

  html, body {
    width: 100%; min-height: 100vh;
    font-family: 'Inter', sans-serif;
    background: var(--primary-dark);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'cv02','cv03','cv04','cv11';
  }

  body {
    background:
      radial-gradient(ellipse 70% 50% at 18% 8%,
        rgba(var(--col-pend-rgb), 0.10) 0%, transparent 55%),
      radial-gradient(ellipse 70% 50% at 82% 92%,
        rgba(var(--col-acomp-rgb), 0.13) 0%, transparent 55%),
      radial-gradient(ellipse 90% 70% at 50% 50%,
        rgba(var(--primary-rgb), 0.55) 0%, var(--primary-dark) 70%);
    background-attachment: fixed;
    animation: atmosphericBreathe 16s ease-in-out infinite;
    overflow-x: hidden;
  }

  @keyframes atmosphericBreathe {
    0%, 100% { background-position: 0% 0%, 100% 100%, 50% 50%; }
    50%      { background-position: 3% 2%, 97% 98%, 50% 50%; }
  }

  /* Vagalumes — partículas suaves no fundo */
  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 22%, rgba(245,168,73,0.5), transparent 60%),
      radial-gradient(1px 1px at 78% 14%, rgba(255,255,255,0.45), transparent 60%),
      radial-gradient(1.2px 1.2px at 32% 78%, rgba(167,139,250,0.4), transparent 60%),
      radial-gradient(1px 1px at 62% 68%, rgba(232,123,30,0.55), transparent 60%),
      radial-gradient(1.6px 1.6px at 88% 48%, rgba(255,255,255,0.35), transparent 60%),
      radial-gradient(1px 1px at 18% 56%, rgba(251,191,36,0.45), transparent 60%),
      radial-gradient(1.2px 1.2px at 48% 24%, rgba(255,255,255,0.3), transparent 60%),
      radial-gradient(1px 1px at 92% 80%, rgba(45,212,191,0.4), transparent 60%);
    animation: fireflies 18s ease-in-out infinite;
  }
  @keyframes fireflies {
    0%, 100% { opacity: 0.55; transform: translate(0, 0); }
    33%      { opacity: 0.85; transform: translate(4px, -3px); }
    66%      { opacity: 0.45; transform: translate(-3px, 4px); }
  }

  /* ─── Header ───────────────────────────────────────────── */
  .header {
    height: 64px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 32px;
    border-bottom: 1px solid var(--glass-border);
    background: rgba(15,31,61,0.78);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    position: sticky; top: 0; z-index: 30;
  }
  .header img { height: 28px; width: auto; }
  .header-brand { font-size: 14px; font-weight: 800; letter-spacing: 0.16em; color: var(--text); }
  .header-divider { width: 1px; height: 28px; background: rgba(255,255,255,0.18); margin: 0 4px; }
  .header-title {
    font-size: 13.5px; font-weight: 700; color: var(--text);
    letter-spacing: 0.22em; text-transform: uppercase;
  }
  .header-title .accent { color: var(--accent); }
  .header-spacer { flex: 1; }
  .header-meta {
    text-align: right; font-size: 11px; color: var(--text-muted); line-height: 1.5;
  }
  .header-meta strong { color: var(--accent); font-weight: 600; }
  .refresh-btn {
    font-size: 11px; font-weight: 600; color: var(--accent);
    border: 1px solid rgba(var(--accent-rgb), 0.45); border-radius: 8px;
    padding: 7px 14px; cursor: pointer; background: transparent;
    font-family: inherit; transition: all 0.2s;
    margin-left: 14px;
  }
  .refresh-btn:hover { background: rgba(var(--accent-rgb), 0.14); border-color: var(--accent); }

  /* ─── Two-column shell ───────────────────────────────────── */
  .shell {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    min-height: calc(100vh - 64px - 48px);
  }
  .col {
    padding: 26px 28px 32px;
    min-width: 0;
    display: flex; flex-direction: column; gap: 20px;
    position: relative;
  }
  .col + .col {
    border-left: 1px solid var(--glass-border);
  }
  /* Faixa colorida superior por coluna */
  .col::before {
    content: '';
    position: absolute; left: 0; right: 0; top: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--col-tint), transparent);
    opacity: 0.55;
  }
  .col.pend  { --col-tint: var(--col-pend);  --col-tint-rgb: var(--col-pend-rgb); }
  .col.acomp { --col-tint: var(--col-acomp); --col-tint-rgb: var(--col-acomp-rgb); }

  /* Cabeçalho da coluna — centralizado, com separador */
  .col-header {
    display: flex; flex-direction: column; align-items: center;
    gap: 10px;
    padding: 4px 0 14px;
    position: relative;
  }
  .col-header h2 {
    font-size: 22px; font-weight: 800; color: var(--text);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
    text-shadow: 0 0 24px rgba(var(--col-tint-rgb), 0.35);
    display: flex; align-items: center; gap: 14px;
  }
  .col-header h2 .glyph {
    color: var(--col-tint);
    font-size: 18px;
    opacity: 0.85;
    filter: drop-shadow(0 0 8px rgba(var(--col-tint-rgb),0.6));
  }
  .col-header .separator {
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    width: 80%; max-width: 360px;
  }
  .col-header .separator .line {
    flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(var(--col-tint-rgb),0.55), transparent);
  }
  .col-header .separator .diamond {
    width: 6px; height: 6px;
    transform: rotate(45deg);
    background: var(--col-tint);
    box-shadow: 0 0 10px var(--col-tint);
  }
  .col-header .count-pill {
    font-size: 11px; font-weight: 700;
    padding: 5px 14px; border-radius: 99px;
    background: rgba(var(--col-tint-rgb), 0.14);
    color: var(--col-tint);
    border: 1px solid rgba(var(--col-tint-rgb), 0.40);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    box-shadow: 0 0 16px rgba(var(--col-tint-rgb),0.18);
  }

  /* ─── KPI mini cards ───────────────────────────────────── */
  .kpi-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .kpi {
    position: relative;
    background:
      radial-gradient(ellipse 100% 80% at 50% 110%,
        rgba(var(--kpi-rgb, var(--col-tint-rgb)), 0.18) 0%,
        transparent 60%),
      var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 14px 16px 13px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
    transition: transform 0.25s cubic-bezier(0.4,0,0.2,1), border-color 0.25s, box-shadow 0.25s;
    /* Garante mesma altura mínima em ambas as colunas, independente do texto do sub */
    min-height: 112px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .kpi::before {
    /* Glow neon de baixo, animado */
    content: '';
    position: absolute; left: 50%; bottom: -20px;
    width: 140%; height: 60px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center,
      rgba(var(--kpi-rgb, var(--col-tint-rgb)), 0.55) 0%,
      transparent 70%);
    filter: blur(18px);
    opacity: 0.55;
    animation: kpiGlowPulse 4.2s ease-in-out infinite;
    pointer-events: none;
  }
  .kpi::after {
    content: '';
    position: absolute; left: 0; right: 0; top: 0; height: 2px;
    background: var(--kpi-color, var(--col-tint));
    opacity: 0.9;
    box-shadow: 0 0 12px var(--kpi-color, var(--col-tint));
  }
  @keyframes kpiGlowPulse {
    0%, 100% { opacity: 0.42; transform: translateX(-50%) scaleX(0.92); }
    50%      { opacity: 0.72; transform: translateX(-50%) scaleX(1.05); }
  }
  .kpi:hover {
    transform: translateY(-2px);
    border-color: var(--glass-border-strong);
    box-shadow: 0 10px 30px rgba(0,0,0,0.30);
  }
  .kpi .label {
    font-size: 9.5px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.12em;
    margin-bottom: 10px;
    position: relative; z-index: 1;
  }
  .kpi .value {
    font-size: 32px; font-weight: 900; line-height: 1;
    letter-spacing: -0.025em; color: var(--text);
    font-feature-settings: 'tnum';
    position: relative; z-index: 1;
    text-shadow: 0 0 20px rgba(var(--kpi-rgb, var(--col-tint-rgb)), 0.35);
  }
  .kpi .sub {
    font-size: 10.5px; color: var(--text-faint);
    margin-top: 6px; font-weight: 500;
    position: relative; z-index: 1;
    line-height: 1.3;
    min-height: 28px;
    display: flex; align-items: flex-end;
  }
  .kpi .delta-row {
    display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap;
    position: relative; z-index: 1;
  }
  .kpi-delta {
    font-size: 10px; font-weight: 700;
    padding: 3px 8px; border-radius: 99px;
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.78);
    letter-spacing: 0.02em;
    font-feature-settings: 'tnum';
  }
  .kpi-delta.up-bad   { color: #FF8A85; background: rgba(255,107,107,0.10); border-color: rgba(255,107,107,0.30); }
  .kpi-delta.down-good{ color: #5EEAD4; background: rgba(94,234,212,0.10); border-color: rgba(94,234,212,0.30); }
  .kpi-delta.up-good  { color: #5EEAD4; background: rgba(94,234,212,0.10); border-color: rgba(94,234,212,0.30); }
  .kpi-delta.down-bad { color: #FF8A85; background: rgba(255,107,107,0.10); border-color: rgba(255,107,107,0.30); }
  .kpi-delta.neutral  { color: rgba(255,255,255,0.70); }
  .kpi-delta .arrow   { font-size: 9px; opacity: 0.9; }

  /* ─── Filter (dropdown estilo Excel) ───────────────────── */
  .filter-strip {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 4px 0 12px;
    align-items: center;
  }
  .filter-strip .f-label {
    font-size: 9.5px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.12em;
    margin-right: 2px; font-weight: 700;
  }
  .filter-select {
    appearance: none;
    -webkit-appearance: none;
    background: rgba(255,255,255,0.05) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23ffffffaa' d='M0 0l5 6 5-6z'/></svg>") no-repeat right 10px center;
    border: 1px solid rgba(255,255,255,0.10);
    color: var(--text);
    font-family: inherit;
    font-size: 12px; font-weight: 600;
    padding: 6px 28px 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    min-width: 220px;
    transition: border-color 0.18s, background-color 0.18s, box-shadow 0.18s;
    outline: none;
  }
  .filter-select:hover { border-color: rgba(var(--col-tint-rgb), 0.45); }
  .filter-select:focus { border-color: rgba(var(--col-tint-rgb), 0.75); box-shadow: 0 0 0 3px rgba(var(--col-tint-rgb), 0.18); }
  .filter-select option { background: #11131A; color: var(--text); }
  .filter-clear {
    font-size: 10px; padding: 5px 10px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.10);
    background: transparent; color: rgba(255,255,255,0.55);
    cursor: pointer; transition: color 0.18s, border-color 0.18s;
  }
  .filter-clear:hover { color: var(--text); border-color: rgba(255,255,255,0.30); }
  .filter-clear[hidden] { display: none; }

  /* Filtro por coluna — só o ícone ▼, sem texto ocupando largura */
  th .col-filter-wrap { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 2px; line-height: 1.1; }
  th .col-filter-wrap > .col-filter-row { display: inline-flex; align-items: center; gap: 4px; }
  th .col-filter {
    appearance: none; -webkit-appearance: none;
    background: rgba(255,255,255,0.04) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path fill='%23ffffffaa' d='M0 0l4 5 4-5z'/></svg>") no-repeat center center;
    background-size: 8px 5px;
    border: 1px solid rgba(255,255,255,0.10);
    color: transparent;
    text-shadow: 0 0 0 transparent;
    font-family: inherit; font-size: 0;
    width: 22px; height: 18px;
    padding: 0;
    border-radius: 4px; cursor: pointer; outline: none;
    transition: border-color 0.15s, background-color 0.15s;
  }
  th .col-filter:hover { border-color: rgba(var(--col-tint-rgb), 0.55); background-color: rgba(var(--col-tint-rgb), 0.10); }
  th .col-filter.active {
    background-color: rgba(var(--col-tint-rgb), 0.22);
    border-color: rgba(var(--col-tint-rgb), 0.65);
  }
  th .col-filter option {
    background: #11131A; color: var(--text);
    font-size: 11px; font-weight: 500;
  }
  th .col-filter-tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 9px; font-weight: 600;
    padding: 1px 5px 1px 6px;
    border-radius: 3px;
    background: rgba(var(--col-tint-rgb), 0.18);
    border: 1px solid rgba(var(--col-tint-rgb), 0.40);
    color: var(--col-tint);
    text-transform: none; letter-spacing: 0;
    max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: pointer;
  }
  th .col-filter-tag:hover { background: rgba(var(--col-tint-rgb), 0.30); }
  th .col-filter-tag .x { opacity: 0.7; font-weight: 700; }

  /* Task code (substitui colunas Sugestão de Lista e Onde Está) */
  .task-code {
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px; font-weight: 600;
    color: rgba(255,255,255,0.80);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.10);
    padding: 3px 8px; border-radius: 5px;
    letter-spacing: 0.02em;
    cursor: pointer; user-select: all;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    display: inline-block;
  }
  .task-code:hover { background: rgba(var(--col-tint-rgb), 0.15); border-color: rgba(var(--col-tint-rgb), 0.45); color: var(--col-tint); }
  .task-code a { color: inherit; text-decoration: none; }

  /* S19: sugestao de destino da acao (roteador deterministico) */
  .sug-lista { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.72); }
  .sug-lista.forte { color: var(--col-tint); }
  .sug-lista.nenhuma { color: rgba(255,255,255,0.34); font-weight: 500; }

  /* Botão Triagem manual (substitui badge italic) */
  .btn-triagem {
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    padding: 5px 10px; border-radius: 6px;
    border: 1px dashed rgba(255,255,255,0.30);
    background: rgba(255,255,255,0.04);
    color: rgba(255,255,255,0.78);
    cursor: pointer; text-transform: uppercase;
    transition: background 0.18s, color 0.18s, border-color 0.18s, transform 0.15s;
  }
  .btn-triagem:hover {
    background: rgba(var(--col-tint-rgb), 0.15);
    border-color: rgba(var(--col-tint-rgb), 0.55);
    border-style: solid;
    color: var(--col-tint);
    transform: translateY(-1px);
  }

  /* Botão Recusar (vermelho) — coluna Ações */
  .btn-reject {
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    padding: 5px 11px; border-radius: 6px;
    border: 1px solid rgba(255,107,107,0.40);
    background: rgba(255,107,107,0.10);
    color: #FF8A85;
    cursor: pointer; text-transform: uppercase;
    transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
  }
  .btn-reject:hover {
    background: rgba(255,107,107,0.22);
    box-shadow: 0 0 12px rgba(255,107,107,0.30);
    transform: translateY(-1px);
  }
  .btn-approve {
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    padding: 5px 11px; border-radius: 6px;
    border: 1px solid rgba(94,234,212,0.45);
    background: rgba(94,234,212,0.12);
    color: #5EEAD4;
    cursor: pointer; text-transform: uppercase;
    transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
  }
  .btn-approve:hover {
    background: rgba(94,234,212,0.22);
    box-shadow: 0 0 12px rgba(94,234,212,0.30);
    transform: translateY(-1px);
  }
  .btn-icon {
    text-transform: none;
    padding: 4px 8px;
    font-size: 14px;
    line-height: 1;
    letter-spacing: 0;
    min-width: 32px;
  }
  /* Aprovar como dropdown inline (substitui modal — picker igual filtro Responsável) */
  .btn-approve-select {
    appearance: none; -webkit-appearance: none;
    background: rgba(94,234,212,0.12) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path fill='%235EEAD4' d='M0 0l4 5 4-5z'/></svg>") no-repeat right 5px center;
    background-size: 8px 5px;
    border: 1px solid rgba(94,234,212,0.45);
    color: #5EEAD4;
    font-size: 14px; font-weight: 700; line-height: 1;
    text-align: center; text-align-last: center;
    padding: 0 14px 0 6px;
    width: 50px; height: 30px;
    border-radius: 6px; cursor: pointer; outline: none;
    transition: background 0.18s, box-shadow 0.18s, transform 0.15s;
    font-family: inherit;
  }
  .btn-approve-select:hover {
    background-color: rgba(94,234,212,0.22);
    box-shadow: 0 0 12px rgba(94,234,212,0.30);
    transform: translateY(-1px);
  }
  .btn-approve-select option {
    background: #0b1220; color: var(--text);
    font-size: 12px; font-weight: 500;
  }
  .btn-approve-select option:disabled {
    color: var(--text-faint);
    font-style: italic;
  }
  .filter-chip {
    /* legado — mantido pra compatibilidade visual em qualquer canto que ainda use */
    display: none;
  }
  .filter-chip-legacy {
    font-size: 11px; font-weight: 600;
    padding: 5px 11px; border-radius: 99px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    color: rgba(255,255,255,0.78);
    cursor: pointer;
    transition: background 0.18s, color 0.18s, border-color 0.18s, transform 0.15s;
    user-select: none;
  }
  .filter-strip-x {
    font-size: 9.5px; color: var(--text-faint);
    text-transform: uppercase; letter-spacing: 0.12em;
    margin-right: 2px; font-weight: 700;
  }

  /* ─── Mutation actions (F3) ────────────────────────────── */
  .row-actions { display: flex; gap: 6px; justify-content: center; }
  .btn-action {
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    padding: 5px 11px; border-radius: 6px;
    border: 1px solid rgba(var(--col-tint-rgb), 0.40);
    background: rgba(var(--col-tint-rgb), 0.12);
    color: var(--col-tint);
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.18s, transform 0.15s, box-shadow 0.18s;
  }
  .btn-action:hover {
    background: rgba(var(--col-tint-rgb), 0.25);
    box-shadow: 0 0 12px rgba(var(--col-tint-rgb), 0.35);
    transform: translateY(-1px);
  }
  .btn-action.btn-ghost {
    background: transparent;
    color: rgba(255,255,255,0.6);
    border-color: rgba(255,255,255,0.18);
  }
  .btn-action.btn-ghost:hover {
    background: rgba(255,255,255,0.06);

async function fetchPaged(url) {
  let all = [], page = 0;
  while (page < 20) {
    const sep = url.includes('?') ? '&' : '?';
    const r = await fetch(`${url}${sep}page=${page}&subtasks=false`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    const batch = d.tasks || [];
    all = all.concat(batch);
    if (batch.length < 100) break;
    page++;
  }
  return all;
}

const RE_STATUS_DATA = /^\s*\d{2}\/\d{2}\/\d{4}\s*$/;

function prazoBucket(due) {
  if (!due) return 'sem-prazo';
  const d = Number(due), now = Date.now();
  if (d < now) return 'vencido';
  const days = (d - now) / 86400000;
  if (days < 1) return 'hoje';
  if (days < 7) return 'semana';
  return 'futuro';
}
const PRAZO_LABEL = { 'vencido':'⚠ Vencido', 'hoje':'Hoje', 'semana':'Esta semana', 'futuro':'Mais de 7 dias', 'sem-prazo':'Sem prazo' };

function idadeBucket(created) {
  if (!created) return 'sem-data';
  const days = Math.floor((Date.now() - Number(created)) / 86400000);
  if (days < 1) return 'hoje';
  if (days < 3) return '1-3';
  return '3+';
}
const IDADE_LABEL = { 'hoje':'Hoje', '1-3':'1–3 dias', '3+':'3+ dias', 'sem-data':'Sem data' };

function applyColFilters(tasks, which) {
  const cf = state[which === 'pend' ? 'colPend' : 'colAcomp'];
  return tasks.filter(t => {
    if (cf.tarefa && t.name !== cf.tarefa) return false;
    if (cf.responsavel) {
      const has = (t.assignees||[]).some(u => (u.username||u.email||'').toLowerCase() === cf.responsavel);
      const isNone = !(t.assignees||[]).length && cf.responsavel === '__none__';
      if (!has && !isNone) return false;
    }
    if (cf.prazo && prazoBucket(t.due_date) !== cf.prazo) return false;
    if (cf.idade && dataDaAta(t) !== cf.idade) return false;
    if (cf.status && (t.status?.status||'').toLowerCase() !== cf.status) return false;
    return true;
  });
}

function colSelectHTML(label, which, col, options, current) {

// Constrói lista de chips de colaboradores (apenas membros do workspace que aparecem nas tasks)
function buildAssigneeChips(tasks, members) {
  const counts = {};
  let noneCount = 0;
  for (const t of tasks) {
    const a = t.assignees || [];
    if (!a.length) { noneCount++; continue; }
    for (const u of a) {
      const key = (u.username || u.email || '').toLowerCase();
      counts[key] = (counts[key] || 0) + 1;
    }
  }
  // Mapa: username lowercase → first name
  const memberByKey = new Map();
  for (const m of members) {
    const k = (m.username || m.email || '').toLowerCase();
    memberByKey.set(k, m);
  }
  // Só mostra usuário que está nas tasks E é membro do workspace
  const chips = Object.entries(counts)
    .filter(([key]) => memberByKey.has(key))
    .map(([key, count]) => {
      const m = memberByKey.get(key);
      const raw = (m.username || m.email || '').split('@')[0];
      const first = (raw.split(/[.\s_-]/).filter(Boolean)[0] || raw);
      return {
        key,
        label: first.charAt(0).toUpperCase() + first.slice(1).toLowerCase(),
        count,
      };
    })
    .sort((a,b) => b.count - a.count);
  if (noneCount > 0) chips.push({ key: '__none__', label: 'Sem responsável', count: noneCount });
  // Somar os chips conta 2x quem tem 2 responsaveis. O total verdadeiro e o
  // numero de ACOES -- que e o que a tabela mostra quando 'Todos' e escolhido.
  chips.totalTarefas = tasks.length;
  return chips;
}

function renderFilterStrip(currentFilter, chips, onSelect) {

    return `<option value="${escHTML(c.key)}" ${sel}>${escHTML(c.label)} (${c.count})</option>`;

  </div>`;
}

function computeDelta(field, todaySnap, yesterdaySnap, filterKey) {
  if (!todaySnap || !yesterdaySnap) return null;
  const get = (snap) => {
    if (filterKey === '__none__') {
      if (field === 'total') return snap.by_assignee?.__none__ || 0;
      return null; // sub-deltas por (filter+field) ainda não cacheados
    }
    if (filterKey) {
      if (field === 'total') return snap.by_assignee?.[filterKey] || 0;
      return null;
    }
    if (field === 'total')        return snap.total;
    if (field === 'overdue')      return snap.overdue;
    if (field === 'no_assignee')  return snap.no_assignee;
    return null;
  };
  const a = get(todaySnap), b = get(yesterdaySnap);
  if (a == null || b == null) return null;
  return a - b;
}

// Renderiza um chip de delta. `goodWhen`: 'down' = bom se desceu, 'up' = bom se subiu
function deltaChip(delta, goodWhen) {
  if (delta == null) return '';
  if (delta === 0) return `<span class="kpi-delta neutral">— sem mudança</span>`;
  const sign = delta > 0 ? '+' : '';
  const arrow = delta > 0 ? '▲' : '▼';
  let cls = 'neutral';
  if (goodWhen === 'down') cls = delta > 0 ? 'up-bad'  : 'down-good';
  if (goodWhen === 'up')   cls = delta > 0 ? 'up-good' : 'down-bad';
  return `<span class="kpi-delta ${cls}"><span class="arrow">${arrow}</span>${sign}${delta} vs ontem</span>`;
}

// LEFT — Donut: por Responsável (apenas primeiro nome)
function renderResponsavelDonut(canvas, backlog) {
  const counts = {};
  // labelKeys: label visível → key real (username lowercase ou __none__)
  const labelKeys = {};
  for (const t of backlog) {
    const a = t.assignees || [];
    if (!a.length) {
      counts['Sem responsável'] = (counts['Sem responsável']||0) + 1;
      labelKeys['Sem responsável'] = '__none__';
      continue;
    }
    for (const u of a) {
      const n = firstName(u);
      counts[n] = (counts[n]||0) + 1;
      labelKeys[n] = (u.username || u.email || '').toLowerCase();
    }
  }
  // Ordena com "Sem responsável" no final
  const entries = Object.entries(counts);
  entries.sort((a,b) => {
    if (a[0] === 'Sem responsável') return 1;
    if (b[0] === 'Sem responsável') return -1;
    return b[1] - a[1];
  });
  const labels = entries.map(e => e[0]);
  const values = entries.map(e => e[1]);
  const colors = labels.map((l,i) => l === 'Sem responsável' ? PALETTE.dim : AURORA[i % AURORA.length]);

  // Legenda embaixo (caixa estreita) come ~80 px; sem folga o anel encolhe
  // ate o rotulo central transbordar. So este card cresce.
  canvas.parentElement.style.height =
    canvas.parentElement.clientWidth < 420 ? '268px' : '';
  destroyChart('respDonut');
  charts.respDonut = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: colors,
        borderColor: '#0F1F3D',
        borderWidth: 2,
        hoverOffset: 12,

// LEFT — Bar list: por Empreendimento
function renderTopEmpreendimentos(container, backlog) {
  const counts = {};
  for (const t of backlog) {
    const hay = ((t.name||'') + ' | ' + (t.description||'')).toLowerCase();
    let matched = null;
    for (const [kw, , lname] of ROUTER_EMPREENDIMENTO) {
      if (hay.includes(kw)) { matched = lname.replace(/^Emp\.\s*/, ''); break; }
    }
    const key = matched || 'Sem empreendimento';
    counts[key] = (counts[key] || 0) + 1;
  }
  const items = Object.entries(counts)
    .map(([label, value]) => ({label, value}))
    .sort((a,b) => {
      if (a.label === 'Sem empreendimento') return 1;
      if (b.label === 'Sem empreendimento') return -1;
      return b.value - a.value;
    })
    .slice(0, 6);
  renderBars(container, items, true);
}

// RIGHT — Donut: status das triadas
function renderStatusDonut(canvas, moved) {
  const b = { 'A fazer':0, 'Em andamento':0, 'Validação':0, 'Concluído':0 };
  for (const t of moved) {
    const s = (t.status?.status || '').toLowerCase();
    if (['done','closed'].includes((t.status?.type||'').toLowerCase()) || ['done','complete','concluído','concluido','closed','feito','arquivo fechado'].includes(s)) b['Concluído']++;
    else if (['validando','em aprovação','em aprovacao'].includes(s)) b['Validação']++;
    else if (['in progress','em andamento','doing','active','fazendo'].includes(s)) b['Em andamento']++;
    else b['A fazer']++;
  }
  destroyChart('statusDonut');
  charts.statusDonut = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels: Object.keys(b),
      datasets: [{
        data: Object.values(b),
        backgroundColor: ['#6E7E9E', '#E87B1E', '#C77DFF', '#34D399'],
        borderColor: '#0F1F3D',
        borderWidth: 2,
        hoverOffset: 12,
        hoverBorderColor: 'rgba(255,255,255,0.4)',
      }]
    },
    options: donutOptions(),
    plugins: [centerTotalPlugin]
  });
}

// RIGHT — Bar list: top 5 responsáveis (apenas primeiro nome)
function renderTopAssignees(container, moved) {
  const open = moved.filter(t => !isTaskDone(t));
  const counts = {};
  for (const t of open) {
    const a = t.assignees || [];
    if (!a.length) { counts['Sem responsável'] = (counts['Sem responsável']||0) + 1; continue; }
    for (const u of a) {
      const n = firstName(u);
      counts[n] = (counts[n]||0) + 1;
    }
  }
  const items = Object.entries(counts)
    .map(([label, value]) => ({label, value}))
    .sort((a,b) => {
      if (a.label === 'Sem responsável') return 1;
      if (b.label === 'Sem responsável') return -1;
      return b.value - a.value;
    }).slice(0, 6);
  renderBars(container, items, true);
}

function renderBars(container, items, vibrant) {
  if (!items.length) { container.innerHTML = `<div class="chart-empty">Sem dados</div>`; return; }
  const M = Math.max(...items.map(i => i.value), 1);
  container.innerHTML = `<div class="bars">${items.map((i, idx) => {
    const c = vibrant ? (i.label.startsWith('Sem ') ? '#6E7E9E' : AURORA[idx % AURORA.length]) : null;
    const fillStyle = c
      ? `background:linear-gradient(90deg, ${c}, ${c}cc);box-shadow:0 0 10px ${c}66`
      : '';
    const valColor = c ? `color:${c}` : '';
    return `<div class="bar-row">
      <div class="bar-name" title="${escHTML(i.label)}">${escHTML(i.label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(i.value/M*100).toFixed(1)}%;${fillStyle}"></div></div>
      <div class="bar-value" style="${valColor}">${i.value}</div>
    </div>`;
  }).join('')}</div>`;
}

// Pega últimos 6 chars do ID — suficiente pra distinguir e curto pra ler
function shortCode(taskId) {
  if (!taskId) return '—';
  const s = String(taskId);
  return s.length > 7 ? s.slice(-7) : s;
}

// ─── Renderers das colunas ─────────────────────────────────
function renderColPend() {
  const fullBacklog = state.backlog;
  const backlog     = applyAssigneeFilter(fullBacklog, state.filterPend);
  const totalFull   = fullBacklog.length;
  const total       = backlog.length;
  const overdue     = backlog.filter(t => t.due_date && Number(t.due_date) < Date.now()).length;
  const noAssign    = backlog.filter(t => !(t.assignees||[]).length).length;
  const stale       = backlog.filter(t => {
    if (!t.date_created) return false;
    const days = Math.floor((Date.now() - Number(t.date_created))/86400000);
    return days >= 3;
  }).length;

  const chips = buildAssigneeChips(fullBacklog, state.members);
  const filterStrip = renderFilterStrip(state.filterPend, chips, 'pend');

  // Delta chips
  const dToday = state.deltas?.today, dYest = state.deltas?.yesterday;
  const dTotal    = computeDelta('total',       dToday, dYest, state.filterPend);
  const dNoAssign = state.filterPend ? null : computeDelta('no_assignee', dToday, dYest, null);
  const dOverdue  = state.filterPend ? null : computeDelta('overdue',     dToday, dYest, null);

  const kpis = `<div class="kpi-strip">
    ${kpi('Ações Totais',         total,    { featured: true, sub: 'na data da ATA, aguardando triagem',
        deltaChip: deltaChip(dTotal, 'down') })}
    ${kpi('ATAs Sem Responsáveis', noAssign, { tone: noAssign ? 'danger' : 'ok', sub: noAssign ? 'precisam de dono' : 'todas com dono',
        deltaChip: deltaChip(dNoAssign, 'down') })}
    ${kpi('Há mais de 3 dias',     stale,    { tone: stale ? 'warn' : 'ok', sub: 'sem triagem' })}
    ${kpi('Quantidade Vencidas',   overdue,  { tone: overdue ? 'danger' : 'ok', sub: 'prazo no passado',
        deltaChip: deltaChip(dOverdue, 'down') })}
  </div>`;

  const charts = `<div class="charts-grid">
    <div class="card">
      <div class="card-title"><span class="dot"></span>Distribuição por Responsável</div>
      <div class="chart-body"><canvas id="ch-sug-donut"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title"><span class="dot"></span>Top empreendimentos</div>
      <div class="chart-body" id="ch-sug-bars"></div>
    </div>
  </div>`;

  const filtered = state.filterPend
    ? `<span class="count-pill">${total} de ${totalFull} ${totalFull===1?'ação':'ações'}</span>`
    : `<span class="count-pill">${total} ${total===1?'ação':'ações'}</span>`;

  document.getElementById('col-pend').innerHTML = `
    <div class="col-header">
      <h2>Pendentes de Triagem ${filtered}</h2>
      <div class="separator"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>
    </div>
    ${filterStrip}
    ${kpis}
    ${charts}
    ${renderBacklogTable(backlog)}
  `;

  renderResponsavelDonut(document.getElementById('ch-sug-donut'), backlog);
  renderTopEmpreendimentos(document.getElementById('ch-sug-bars'), backlog);
}

function renderColAcomp() {

  const done      = total - open.length;

    ${kpi('Pessoas Ativas',    people,      { tone: 'purple', sub: 'com tasks abertas' })}

// Aplica filtro vindo de chip ou click no donut, e re-renderiza
function setFilter(which, key) {
  if (which === 'pend') {
    state.filterPend = (key === '' || key == null) ? null : key;
    renderColPend();
  } else if (which === 'acomp') {
    state.filterAcomp = (key === '' || key == null) ? null : key;
    renderColAcomp();
  }
}

  setFilter(which, sel.value);
});
document.addEventListener('click', (ev) => {

});

  const col   = sel.dataset.col;

};

async function apiMutate(taskId, action, body) {
  const r = await fetch(`${WORKER_URL}/task/${taskId}/${action}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });

  if (!r.ok) throw new Error(data.error || `Erro ${r.status}`);
  return data;
}

  const listName = (ALL_LISTS.find(([id]) => id === listId) || [])[1] || null;
  btn.disabled = true; btn.textContent = 'Aprovando…';
  try {
    await apiMutate(taskId, 'move', {
      list_id: listId,
      list_name: listName,
      task_title: task?.name || null,
      approved_by: 'painel',
    });
    showToast('✅ Aprovado — em acompanhamento', 'ok');
    closeModal();
    await load();
  } catch (e) {
    showToast(`Falha: ${e.message}`, 'err', 7000);

// ─── Modal: Trocar responsável ─────────────────────────────
window.openAssigneeModal = function(taskId) {
  const task = findTask(taskId); if (!task) return;
  const current = new Set((task.assignees||[]).map(a => a.id));
  const opts = state.members.map(m => `
    <label>
      <input type="checkbox" value="${m.id}" ${current.has(m.id) ? 'checked' : ''}>
      <span>${escHTML(m.username)}</span>
    </label>`).join('');
  openModal(`
    <h3>Definir responsável(eis)</h3>
    <div class="modal-sub"><b>${escHTML(task.name)}</b><br>Selecione um ou mais membros do workspace.</div>
    <div class="assignee-picker">${opts}</div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-confirm" id="m-go" onclick="doAssignee('${taskId}')">Salvar</button>
    </div>
  `);
};
window.doAssignee = async function(taskId) {
  const btn = document.getElementById('m-go');
  const task = findTask(taskId);
  const before = new Set((task.assignees||[]).map(a => a.id));
  const after = new Set(Array.from(document.querySelectorAll('.assignee-picker input:checked')).map(i => Number(i.value)));
  const add = [...after].filter(x => !before.has(x));
  const rem = [...before].filter(x => !after.has(x));
  if (!add.length && !rem.length) { closeModal(); return; }
  btn.disabled = true; btn.textContent = 'Salvando…';
  try {
    await apiMutate(taskId, 'assignee', { add, rem, task_title: task?.name || null, approved_by: 'painel' });
    showToast('✅ Responsáveis atualizados', 'ok');
    closeModal();
    await load();
  } catch (e) {
    showToast(`Falha: ${e.message}`, 'err', 7000);
    btn.disabled = false; btn.textContent = 'Salvar';
  }
};

// ─── Modal: Mudar prazo ────────────────────────────────────
window.openDueDateModal = function(taskId) {

window.doDueDate = async function(taskId) {

    await apiMutate(taskId, 'due_date', { due_date: due, task_title: task?.name || null, approved_by: 'painel' });
    showToast('✅ Prazo atualizado', 'ok');

    showToast(`Falha: ${e.message}`, 'err', 7000);

  }
};

// Cache local de statuses por list_id (TTL 1h)
const statusCache = new Map(); // list_id → { fetched_at, statuses:[{status,color}] }
async function getStatusesForList(listId) {
  const hit = statusCache.get(listId);
  if (hit && (Date.now() - hit.fetched_at) < 3600 * 1000) return hit.statuses;
  try {
    const r = await fetch(`${WORKER_URL}/list/${listId}/statuses`);
    const d = await r.json();
    const statuses = d.statuses || [];
    statusCache.set(listId, { fetched_at: Date.now(), statuses });
    return statuses;
  } catch (e) {
    return [];
  }
}

// ─── Modal: Mudar status (Em Acompanhamento) — status reais do ClickUp ───
window.openStatusModal = async function(taskId) {
  const task = findTask(taskId); if (!task) return;
  const cur = (task.status?.status || '').toLowerCase();
  const listId = task.list?.id || task.list_id;
  openModal(`
    <h3>Mudar status</h3>
    <div class="modal-sub"><b>${escHTML(task.name)}</b></div>
    <label>Status (carregando…)</label>
    <select id="m-status" disabled><option>…</option></select>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-confirm" id="m-go" disabled>Salvar</button>
    </div>
  `);
  // Busca status reais da lista da task
  const statuses = await getStatusesForList(listId);
  if (!statuses.length) {
    document.querySelector('#modal-body label').textContent = 'Status (não foi possível carregar — usando padrão)';
    const fallback = STATUS_OPTIONS;
    const opts = fallback.map(s => `<option value="${s}" ${s===cur ? 'selected':''}>${escHTML(s)}</option>`).join('');
    document.getElementById('m-status').innerHTML = opts;
  } else {
    const opts = statuses.map(s => {
      const sel = s.status.toLowerCase() === cur ? 'selected' : '';
      return `<option value="${escHTML(s.status)}" ${sel}>${escHTML(s.status)}</option>`;
    }).join('');
    document.getElementById('m-status').innerHTML = opts;
    document.querySelector('#modal-body label').textContent = `Status (${statuses.length} disponíveis nessa lista)`;
  }
  document.getElementById('m-status').disabled = false;
  const btn = document.getElementById('m-go');
  btn.disabled = false;
  btn.textContent = 'Salvar';
  btn.onclick = () => doStatus(taskId);
};
window.doStatus = async function(taskId) {
  const btn = document.getElementById('m-go');
  const s = document.getElementById('m-status').value;
  const task = findTask(taskId);
  btn.disabled = true; btn.textContent = 'Salvando…';
  try {
    await apiMutate(taskId, 'status', { status: s, task_title: task?.name || null, approved_by: 'painel' });
    showToast('✅ Status atualizado', 'ok');
    closeModal();
    await load();
  } catch (e) {
    showToast(`Falha: ${e.message}`, 'err', 7000);
    btn.disabled = false; btn.textContent = 'Salvar';
  }
};

// ─── Aprovar inline (substitui modal — picker direto no select) ────
// Triagem da DUO: sai da coluna-data e entra em acompanhamento, SEM sair da
// lista confidencial (mover para lista publica vazaria a acao).
window.doTriarInline = async function(sel, taskId) {
  const novo = sel.value;
  if (!novo) return;
  const task = findTask(taskId);
  sel.disabled = true;
  try {
    await apiMutate(taskId, 'status', { status: novo, task_title: task?.name || null, approved_by: 'painel-duo' });
    showToast('✅ Triada — agora em acompanhamento', 'ok');
    await load();
  } catch (e) {
    showToast(`Falha: ${e.message}`, 'err', 7000);
    sel.disabled = false; sel.value = '';
  }
};

window.doApproveInline = async function(sel, taskId) {
  const listId = sel.value;
  if (!listId) return;
  const task = findTask(taskId);
  const listName = (ALL_LISTS.find(([id]) => id === listId) || [])[1] || listId;
  const ok = confirm(`Aprovar?\n\n"${task?.name || taskId}"\n\n→ ${listName} (registrado em comentário)\n\nA task entra em "Em Acompanhamento", sem sair do Backlog.`);
  if (!ok) { sel.value = ''; return; }
  sel.disabled = true;
  try {
    await apiMutate(taskId, 'move', {
      list_id: listId,
      list_name: listName,
      task_title: task?.name || null,
      approved_by: 'painel',
    });
    showToast(`✅ Em acompanhamento (ref.: ${listName})`, 'ok');
    await load();
  } catch (e) {
    showToast(`Falha: ${e.message}`, 'err', 7000);
    sel.disabled = false;
    sel.value = '';
  }
};

// ─── Recusar (cancela a task) ──────────────────────────────
window.doReject = async function(taskId) {
  const task = findTask(taskId);
  if (!task) return;
  const ok = confirm(`Recusar a ação?\n\n"${task.name}"\n\nA task será marcada como CANCELADA no ClickUp (reversível).`);
  if (!ok) return;
  try {
    await apiMutate(taskId, 'reject', { task_title: task.name || null, approved_by: 'painel' });
    showToast('❌ Ação recusada (cancelada)', 'ok');
    await load();
  } catch (e) {
    showToast(`Falha: ${e.message}`, 'err', 7000);
  }
};

// ─── Loader principal ──────────────────────────────────────
let isLoading = false;
async function load() {
  if (isLoading) return;
  isLoading = true;
  document.getElementById('col-pend').innerHTML  = '<div class="loading"><span class="spinner"></span>Carregando pendentes…</div>';
  document.getElementById('col-acomp').innerHTML = '<div class="loading"><span class="spinner"></span>Carregando acompanhamento…</div>';
  document.getElementById('update-time').textContent = 'Atualizando…';

  try {
    const [backlog, gestionAll, members, deltas, statusesPorLista] = await Promise.all([
      fetchBacklog(), fetchGestionAll(), fetchMembers(), fetchDeltas(),
      Promise.all(BACKLOG_LISTS.map(async lid => [lid, await getStatusesForList(lid)]))
    ]);
    // Alvos de triagem = os status da lista que NAO sao data (a data e a origem, nao o destino);
    // cada lista tem os seus, e a tarefa so pode ir para um status da lista dona dela
    state.alvosPorLista = {};
    for (const [lid, sts] of statusesPorLista) state.alvosPorLista[lid] = (sts || []).filter(s => !RE_STATUS_DATA.test(s.status || ''));
    state.alvosTriagem = state.alvosPorLista[BACKLOG_LIST] || [];
    const isCancelled = (t) => {
      const s = (t.status?.status || '').toLowerCase();
      return s === 'cancelado' || s === 'cancelled' || s === 'canceled'
        || s === '🗑 excluir' || s === '🗑 excluídas';
    };
    // Uma lista so, particionada pela etapa de triagem (a coluna-data).
    const vivas = backlog.filter(t => !isCancelled(t));
    state.backlog = vivas.filter(isPendenteTriagem);
    state.moved   = vivas.filter(t => !isPendenteTriagem(t));
    state.members = members;
    state.deltas  = deltas || state.deltas;

    renderColPend();
    renderColAcomp();

    const nowStr = new Date().toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'America/Recife'});
    document.getElementById('update-time').textContent = `Atualizado ${nowStr} BRT`;
    const open = state.moved.filter(t => !isTaskDone(t));
    document.getElementById('footer-count').textContent =
      `${state.backlog.length} pendentes · ${open.length} em acompanhamento`;
  } catch (e) {
    document.getElementById('col-pend').innerHTML = `<div class="loading">Erro ao carregar: ${escHTML(e.message)}</div>`;
    document.getElementById('col-acomp').innerHTML = '';
    document.getElementById('update-time').textContent = 'Erro';
  } finally {
    isLoading = false;
  }
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
